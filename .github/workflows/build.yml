name: Bitcoin order App

on:
  push:
    branches: [githubcicd]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workshop6-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKSHOP6_GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Use Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: 16.20.2
          cache: npm

      - name: Install Dependencies
        run: npm ci --force

      - name: Build
        run: npm run build -- --base-href=/bitcoin-order-app/

      - name: Lint
        run: npm run lint

      # Optional unit tests are not enabled in the basic workshop.
      # - name: Test
      #   run: npm run test -- --watch=false --browsers=ChromeHeadless

      - name: Conventional Changelog Action
        id: changelog
        uses: TriPSs/conventional-changelog-action@v3
        with:
          github-token: ${{ secrets.WORKSHOP6_GITHUB_TOKEN }}
          output-file: "false"
          version-file: "./package.json,./package-lock.json"
          git-message: "chore(release): {version} [skip ci]"

      - name: Create Release
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.WORKSHOP6_GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          release_name: ${{ steps.changelog.outputs.tag }}
          body: ${{ steps.changelog.outputs.clean_changelog }}

      - name: Deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm run deploy -- --no-build
