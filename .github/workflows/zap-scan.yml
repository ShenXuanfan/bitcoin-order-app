name: owasp-scan
on:
  push:
    branches: [githubcicd]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: ZAP baseline scan of my published website
        run: bash scripts/zap-script.sh
      - name: Archive DAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-reports/
          if-no-files-found: error
